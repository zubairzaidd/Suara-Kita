*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14111c;color:var(--paper)}body{display:grid;place-items:center;background:radial-gradient(ellipse at center,#33243b,#131019 75%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffe187;outline-offset:3px}[hidden]{display:none!important}
#game{height:100vh;height:100dvh;width:min(100%,580px);position:relative;isolation:isolate;display:flex;flex-direction:column;overflow:hidden;background:var(--ink);box-shadow:0 0 80px #0c0a1180}
#hud{min-height:48px;padding:calc(9px + env(safe-area-inset-top)) 17px 9px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);font:600 .76rem/1.25 ui-monospace,monospace;color:var(--muted)}#hud b{color:var(--paper)}#sound{border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--paper);font:.73rem ui-monospace,monospace;min-height:32px;padding:0 9px}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#473349}#world{height:100%;width:100%;display:block;object-fit:cover;image-rendering:pixelated}#stage:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,#241b2d40,transparent 20%);z-index:0}
.sprite{background-repeat:no-repeat;background-size:400% 200%;background-position:0 0;image-rendering:pixelated;aspect-ratio:1}.nadia{background-image:var(--nadia)}.zubair{background-image:var(--zubair)}
#hero{position:absolute;z-index:1;bottom:-1px;left:50%;transform:translateX(-50%);width:min(78%,38svh,360px);filter:drop-shadow(4px 4px 0 #33213f55)}
#card{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 14px);overflow:auto;width:min(86%,355px);padding:14px 16px 16px;background:#292334f5;color:var(--paper);border:2px solid #917583;border-radius:11px;box-shadow:4px 5px 0 #21192888;font-size:.94rem}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 9px;color:#ffceab;font:700 .77rem/1.3 ui-monospace,monospace}.cardhead small{color:#dac9d0;font-size:.7rem}.callimg{width:min(148px,22svh);margin:0 auto;max-width:58%}.center{text-align:center}
.bubble{padding:9px 11px;border-radius:8px;background:#443447;margin:7px 0;max-width:94%;font-size:.92rem}.outgoing{margin-left:auto;background:#5e3e4b}.stamp{display:block;font:.69rem/1.35 ui-monospace,monospace;color:#e8caba;margin-top:4px}.wave{height:31px;display:flex;align-items:center;gap:3px;margin:8px 0}.wave i{flex:1;background:#ffd0ad;opacity:.86;min-width:1px}.small{font-size:.83rem;color:#f0dce5}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.comparison{border:1px solid #927589;padding:8px;border-radius:5px;background:#382c42;overflow-wrap:anywhere}.comparison b,.comparison strong{display:block}.comparison b{font-size:.79rem;color:#ffceab}.comparison strong{font:700 .74rem/1.4 ui-monospace,monospace;margin-top:6px;color:#ffdb92}
#dock{position:relative;z-index:3;background:var(--panel);border-top:3px solid var(--peach);padding:15px clamp(14px,5vw,26px) calc(16px + env(safe-area-inset-bottom));flex:none;max-height:57%;overflow:auto}
#talk{display:block;width:100%;text-align:left;color:var(--paper);padding:0;border:0;background:transparent;font-size:clamp(1.02rem,3.9vw,1.2rem);line-height:1.52;min-height:88px}#talk:disabled{cursor:default;opacity:1;color:var(--paper)}#by{display:flex;align-items:center;gap:8px;color:var(--peach);font:700 .78rem/1.2 ui-monospace,monospace;letter-spacing:.035em;margin-bottom:6px}#mini{width:32px;flex:none;border-radius:3px}#words{display:block;min-height:2.8em;white-space:pre-line}#hint{display:block;text-align:right;margin-top:6px;color:#dac1c9;font:600 .7rem/1.2 ui-monospace,monospace}
#controls{display:grid;gap:8px}.act{background:#ffd0aa;border:1px solid #ffddc0;color:#2e2031;border-radius:6px;padding:11px 13px;text-align:center;font:700 .97rem/1.3 system-ui,sans-serif;box-shadow:0 2px 0 #8e6461}.choice{text-align:left;background:#3d2e42;color:var(--paper);border:1px solid #866c80;box-shadow:0 2px 0 #110d18}.choice:active,.act:active{transform:translateY(1px)}
#cover{z-index:5;position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(clamp(24px,7svh,68px) + env(safe-area-inset-top)) clamp(24px,8vw,52px) calc(30px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#20192ce6,transparent 55%,#22182ac4)}
#cover h1{margin:10px 0 0;font:italic 600 clamp(4.4rem,15vw,7.4rem)/.83 Georgia,serif;letter-spacing:-.075em;color:#fff1d4;text-shadow:2px 4px 0 #3b253c}#cover h1 span{display:block;margin-left:.09em}#chapterlabel{margin:0;color:#ffe2af;font:bold .79rem ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}#cover h2{margin:17px 0 0;font:normal 1.26rem/1.2 Georgia,serif;color:#ffdfbb}#start{width:100%;min-height:50px;font-size:1.05rem}.covering #hud,.covering #dock{display:none}
@media (max-height:610px){#hud{min-height:34px;padding-top:3px;padding-bottom:3px}#dock{padding-top:8px;padding-bottom:8px}#talk{min-height:62px}#words{min-height:1.7em}#cover h1{font-size:3.7rem}.callimg{width:min(102px,22svh)}#card{padding:8px 11px}}

<section id="stage" aria-label="Adegan"><canvas id="world" width="224" height="232" aria-hidden="true"></canvas><div id="hero" class="sprite nadia" hidden aria-label="Nadia"></div><div id="card" hidden></div></section>

<section id="cover"><div><p id="chapterlabel">Bab 1</p><h1>Sisa<span>Suaramu</span></h1><h2 id="subtitle">Dua Es Teh</h2></div><button type="button" class="act" id="start">Mulai Bab 1　▶</button></section>
</main>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const game=byId('game'), card=byId('card'), hero=byId('hero'), words=byId('words'), talk=byId('talk'), hint=byId('hint'), controls=byId('controls'), mini=byId('mini');
const ctx=byId('world').getContext('2d');
const rooms={room:'Balikpapan',boat:'Teluk Balikpapan',stall:'Penajam',night:'Balikpapan'};
let scene='title',layout='plain',emotion=0,muted=false,soundContext=null,running=false,advance=null;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function poly(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function cloud(x,y,k){rect(x,y,18,k,'#f4bfa2');rect(x+4,y-2,9,2,'#f4bfa2');rect(x+15,y+1,10,1,'#f4bfa2')}
function paper(x,y,w,h){rect(x,y,w,h,'#ac8269');rect(x+2,y+2,w-4,h-4,'#f4dfb1')}
function coast(sun){
 const tones=sun?['#957a9c','#c791a1','#ecaa98','#fbc89f']:['#8cbdb9','#9fc9c3','#bcd8c2','#e2ddbd'];
 tones.forEach((c,i)=>rect(0,i*26,224,26,c));
 if(sun){rect(151,60,19,19,'#ffdaa3');rect(154,57,13,25,'#ffdaa3')}
 [[18,29],[63,45],[119,24],[180,34],[90,67]].forEach(p=>cloud(...p,2));
 poly([[0,99],[0,86],[17,80],[29,85],[47,74],[58,79],[74,75],[90,84],[110,73],[130,79],[144,69],[162,74],[173,69],[195,73],[213,64],[224,68],[224,99]],sun?'#776579':'#6c938c');
 rect(0,92,224,140,sun?'#877e9e':'#6ca6a1');rect(0,92,224,2,'#e1c8af');
 for(let i=0;i<63;i++){let x=(i*71+15)%224,y=96+(i*13)%65;rect(x,y,3+(i*5)%14,1,i%3?'#aac0b3':'#f7d1ae')}
}
function ferry(x,y){poly([[x,y+9],[x+38,y+9],[x+32,y+14],[x+7,y+14]],'#3b394b');rect(x+7,y+4,23,5,'#eddeca');rect(x+12,y,12,5,'#ead3b9');for(let i=0;i<4;i++)rect(x+10+i*5,y+5,3,2,'#525263');rect(x+18,y-6,1,6,'#413c54');rect(x+19,y-6,6,2,'#c37473')}
function glass(x,y,straw){rect(x+2,y,2,9,'#ffe4b7');rect(x+straw,y-9,2,17,'#ffcc99');rect(x+straw+2,y-10,4,2,'#ffcc99');poly([[x,y+2],[x+21,y+2],[x+18,y+32],[x+3,y+32]],'#f8d1ad');poly([[x+2,y+7],[x+19,y+7],[x+16,y+29],[x+5,y+29]],'#bb6b3f');rect(x+4,y+9,5,4,'#eaa35e');rect(x+11,y+7,5,4,'#f0bf83');rect(x+5,y+17,1,9,'#f1b37b');rect(x,y+1,21,2,'#ffe7ce')}
function wood(y){rect(0,y,224,232-y,'#925c4d');for(let i=y;i<232;i+=11){rect(0,i,224,2,'#694452');rect(13+(i*3)%79,i+6,39,1,'#ac755d');rect(130+(i*2)%29,i+4,19,1,'#774a4a')}}
function draw(which){
 ctx.clearRect(0,0,224,232);
 if(which==='title'){coast(true);ferry(51,99);rect(0,133,224,5,'#453b50');rect(17,137,5,45,'#504254');rect(198,137,5,45,'#504254');wood(171);glass(76,149,12);glass(111,146,5);return}
 if(which==='boat'){coast(false);ferry(142,99);poly([[0,174],[224,145],[224,232],[0,232]],'#917161');for(let i=0;i<4;i++){rect(14+i*62,135-i*2,5,56,'#52505a');rect(14+i*62,135-i*2,1,56,'#ecceaf')}rect(0,137,224,5,'#e1c3a5');rect(0,139,224,3,'#655562');rect(0,159,224,2,'#766662');return}
 if(which==='room'||which==='night'){
 rect(0,0,224,232,'#45344c');rect(0,147,224,85,'#342a3f');for(let i=0;i<224;i+=23)rect(i,0,1,148,'#513e53');rect(23,23,111,91,'#30273d');rect(27,27,103,82,'#897687');rect(30,30,97,75,'#34334f');rect(30,72,97,33,'#4a435f');rect(30,86,97,19,'#605370');
 for(let i=0;i<19;i++)rect(33+(i*27)%91,34+(i*19)%43,1+(i%4===0),1,'#ddc3af');
 rect(101,37,5,6,'#f5d6a4');rect(102,36,4,8,'#f5d6a4');rect(105,35,3,7,'#34334f');
 for(let i=0;i<9;i++){const h=5+(i*7)%14;rect(30+i*11,105-h,11,h,'#332d45');rect(32+i*11,106-h,2,2,'#bb8b7d')}
 rect(76,27,3,83,'#574557');rect(27,73,103,3,'#574557');rect(19,109,121,4,'#97757b');poly([[18,17],[44,17],[40,55],[34,78],[36,113],[18,113]],'#6b5269');rect(21,20,2,88,'#89697d');rect(27,17,104,3,'#504155');
 rect(151,46,49,3,'#ae8077');rect(157,30,5,16,'#8d687d');rect(162,27,4,19,'#b78578');rect(168,33,5,13,'#6b7480');paper(179,29,12,17);
 rect(0,129,76,6,'#996f67');rect(7,135,5,56,'#533d4b');rect(59,135,5,43,'#533d4b');rect(21,102,3,26,'#c6a194');poly([[13,107],[17,92],[28,92],[33,107]],'#f6c390');rect(12,106,22,2,'#ffdb9e');rect(16,127,13,2,'#d1a28b');
 rect(161,126,33,35,'#976a64');rect(158,158,39,5,'#aa7867');rect(161,163,4,24,'#5b4450');rect(190,163,4,24,'#5b4450');poly([[160,128],[174,123],[182,127],[187,150],[179,152],[176,143],[173,158],[157,154]],'#627184');rect(162,129,4,18,'#788799');
 rect(32,187,192,45,'#49374b');poly([[32,185],[62,164],[224,168],[224,214],[34,212]],'#79627d');poly([[57,189],[81,170],[224,173],[224,218],[55,212]],'#8e738d');for(let i=0;i<4;i++)rect(77+i*38,179,2,28,'#a1879b');poly([[37,181],[47,165],[78,165],[69,184]],'#c3a3ad');return}
 coast(false);rect(0,0,224,14,'#714f4d');rect(0,14,224,16,'#e9b488');for(let x=0;x<224;x+=25){rect(x,14,13,16,'#b76d59');rect(x,29,13,4,'#864f4f')}rect(0,33,9,132,'#754e47');rect(216,33,8,133,'#865d50');
 rect(137,33,79,110,'#ceb392');for(let y=42;y<145;y+=18)rect(137,y,79,1,'#b49a87');rect(156,49,46,37,'#7b6257');rect(158,51,42,32,'#41584e');ctx.fillStyle='#f4e3b4';ctx.font='7px monospace';ctx.fillText('SEBLAK',161,61);for(let i=0;i<3;i++){rect(162,67+i*4,16+i*2,1,'#c7c6a1');rect(189,67+i*4,6,1,'#c7c6a1')}
 rect(10,107,127,5,'#8f775c');rect(34,33,4,74,'#966e55');rect(96,33,4,74,'#9e785e');rect(0,140,224,7,'#b78268');rect(0,147,224,32,'#9e715c');for(let x=3;x<224;x+=16)rect(x,147,1,32,'#815a50');rect(9,128,23,12,'#697175');rect(7,127,27,2,'#c3b7a0');rect(14,124,12,3,'#b6a798');wood(177);glass(180,157,9);
}
function elem(tag,txt,cls){const el=document.createElement(tag);if(txt!==undefined)el.textContent=txt;if(cls)el.className=cls;return el}
function face(el,i){el.style.backgroundPosition=(i%4*100/3)+'% '+(i>3?100:0)+'%'}
function setTime(t){byId('clock').textContent=t}
function setScene(name,t){scene=name;layout='plain';byId('place').textContent=rooms[name];setTime(t);card.hidden=true;hero.hidden=true;draw(name)}
function makeCard(title,right){card.replaceChildren();card.hidden=false;const h=elem('div',undefined,'cardhead');h.append(elem('span',title),elem('small',right||''));card.append(h);return card}
function showCall(title='Panggilan video'){layout='call';const c=makeCard('Nadia ♡',title);const p=elem('div',undefined,'callimg sprite nadia');p.id='callface';face(p,emotion);c.append(p)}
function showNadia(){layout='stall';hero.hidden=false;card.hidden=true;face(hero,emotion)}
function cleanStage(){layout='plain';hero.hidden=true;card.hidden=true}
function chat(text,time,out=false){const c=makeCard(out?'Kak Zubair':'Nadia ♡','Pesan');const b=elem('div',text,'bubble'+(out?' outgoing':''));b.append(elem('span',time,'stamp'));c.append(b)}
function compare(text){const c=makeCard('Pesan yang sama','Info pesan');const g=elem('div',undefined,'compare');for(const [owner,t] of [['HP Zubair','Jumat · 23.18'],['HP Nadia','Sabtu · 12.41']]){const a=elem('div',undefined,'comparison');a.append(elem('b',owner),elem('span',text),elem('strong',t));g.append(a)}c.append(g)}
function setPerson(name,idx){const i=idx??0;byId('who').textContent=name||'Zubair · dalam hati';mini.hidden=name!=='Zubair';if(!mini.hidden)face(mini,i);if(name==='Nadia'){emotion=i;face(hero,i);const p=byId('callface');if(p)face(p,i)}}
function idle(){advance=null;talk.disabled=true;hint.textContent='';controls.replaceChildren()}
talk.onclick=()=>{if(advance)advance()};
function say(name,i,text){
 idle();setPerson(name,i);words.textContent='';talk.disabled=false;hint.textContent='Ketuk untuk lanjut　▸';
 return new Promise(resolve=>{
  let n=0,handle=0;
  const finish=()=>{clearInterval(handle);n=text.length;words.textContent=text};
  if(reduceMotion.matches)finish();else handle=setInterval(()=>{n+=2;words.textContent=text.slice(0,n);if(n>=text.length)finish()},18);
  advance=()=>{if(n<text.length){finish();return}idle();resolve()};
 });
}
function ask(name,i,text,labels){idle();setPerson(name,i);words.textContent=text;return new Promise(resolve=>{labels.forEach((s,k)=>{const b=elem('button',s,labels.length>1?'act choice':'act');b.type='button';b.onclick=()=>{idle();resolve(k)};controls.append(b)})})}
function unlock(){try{const C=window.AudioContext||window.webkitAudioContext;if(!soundContext&&C)soundContext=new C();if(soundContext&&soundContext.state==='suspended')soundContext.resume().catch(()=>{})}catch{}}
function tone(freq,len=.12,vol=.075,delay=0,kind='sine'){
 if(muted||!soundContext)return;try{let o=soundContext.createOscillator(),g=soundContext.createGain(),t=soundContext.currentTime+delay;o.type=kind;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(soundContext.destination);o.start(t);o.stop(t+len+.02)}catch{}
}
function clink(){tone(1653,.22,.11);tone(2240,.11,.04,.025);tone(1653,.2,.11,.32);tone(2240,.1,.04,.345)}
function voice(text,pitch){if(muted)return;try{const synth=window.speechSynthesis,v=synth?.getVoices().find(v=>/^id(?:[-_]|$)/i.test(v.lang)&&v.localService);if(v){synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.voice=v;u.pitch=pitch;u.rate=1.14;synth.speak(u);return}}catch{}
 for(let i=0;i<5;i++)tone((i%3===0?282:314)*pitch,.045,.024,i*.105,'triangle')}
function stopVoice(){try{window.speechSynthesis?.cancel()}catch{}}
byId('sound').onclick=()=>{unlock();muted=!muted;if(muted)stopVoice();byId('sound').setAttribute('aria-pressed',String(!muted));byId('sound').textContent=muted?'♪ Hening':'♪ Suara';if(!muted)tone(660)};
const order='Bu, es tehnya dua, ya. Yang satu buat cowok yang katanya kuat.';
const seller='Gulanya biasa, Nak?';
function recorder(){const c=makeCard('Nadia ♡','Pesan suara');const bars=elem('div',undefined,'wave');for(let i=0;i<30;i++){const b=elem('i');b.style.height=(5+(i*11+i*i*7)%27)+'px';bars.append(b)}c.append(bars,elem('div','0:07','stamp'))}
async function recording(last=false){
 recorder();await ask('Pesan suara',0,'Rekaman dari Nadia · 0:07',['▶　Putar rekaman']);unlock();idle();setPerson('Rekaman Nadia',0);
 const lines=last?[[0,'[Suara kertas dibuka.]'],[640,'“Kak, kata yang Nadia tulis kemarin itu…”']]:[[0,'[Ting. Ting. Sendok menyentuh gelas dua kali.]'],[640,'Nadia — “'+order+'”'],[5050,'Ibu warung — “'+seller+'”']];
 const elapsed=card.querySelector('.stamp');let tick=0;elapsed.textContent='0:00 / 0:07';
 if(!last)clink();else tone(390,.08,.027);
 await new Promise(resolve=>{const clock=setInterval(()=>{tick++;elapsed.textContent='0:0'+Math.min(7,tick)+' / 0:07'},1000);
 lines.forEach(([t,s],i)=>{setTimeout(()=>{words.textContent=s;if(i===1)voice(last?'Kak, kata yang Nadia tulis kemarin itu…':order,1.08);if(i===2)voice(seller,.94)},t)});
 setTimeout(()=>{clearInterval(clock);stopVoice();resolve()},last?3500:7000)});
 if(!last){elapsed.textContent='0:07 / 0:07';await ask('Rekaman selesai',0,'Nadia — “'+order+'”\nIbu warung — “'+seller+'”',['Lanjut　▸'])}
}
async function chapter(){
 if(running)return;running=true;unlock();emotion=0;byId('cover').hidden=true;game.classList.remove('covering');
 setScene('room','Jumat · 23.12');makeCard('Nadia ♡','Panggilan masuk').append(elem('div','Panggilan video','center'));tone(530,.18);tone(664,.18,.06,.22);
 await ask('Balikpapan',0,'Jaket buat besok sudah kusampirkan di kursi. HP di sebelah bantal menyala.',['☎　Angkat']);showCall();
 const N=(i,t)=>say('Nadia',i,t), Z=(i,t)=>say('Zubair',i,t);
 await N(0,'Kak, jaketnya udah disiapin?');await Z(0,'Udah. Dari sore malah.');await N(2,'Coba kameranya arahin ke kursi. Nadia mau lihat.');await Z(3,'Lho, sekarang ada pemeriksaan?');await N(1,'Terakhir kakak bilang udah siap, Nadia masih nemenin kakak nyari kaus kaki.');
 const hot=await ask('Nadia',0,'Besok makan seblak di tempat kemarin, ya? Kakak mau level berapa?',['Level tiga. Kakak masih punya harga diri.','Level satu. Kakak pengin menikmati hidup.']);
 if(hot===0){await N(2,'Harga diri kakak kemarin minum es teh Nadia sampai tinggal es batunya.');await Z(4,'Kan kakak kira udah nggak diminum.');await N(3,'Nadia baru nyolok sedotan, Kak.')}else{await N(1,'Akhirnya Nadia bisa minum es teh sendiri.');await Z(0,'Iya, iya. Yang kemarin anggap aja pajak sedotan.')}
 await N(4,'Kalau udah naik kapal, kabarin ya.');await Z(0,'Iya, sayang. Tidur sana.');await ask('Nadia',4,'Kakak duluan yang tutup.',['Tutup telepon']);
 cleanStage();setTime('Jumat · 23.17');tone(812,.12);await recording();
 const replies=['Iya iya, pesenin dua 😂','Loh, katanya es teh Nadia mau diminum sendiri?'];
 const reply=replies[await ask('Zubair',1,'Nadanya persis waktu dia ngeledek tadi. Aku buka kolom balasan.',replies)];
 chat(reply,'Jumat · 23.18　✓',true);setTime('Jumat · 23.18');await say('',0,'Satu centang. Mungkin dia udah tidur.');
 setScene('boat','Sabtu pagi');chat('Udah di kapal.','Pagi　✓✓',true);await say('Zubair',0,'Begitu kapal berangkat, kukirim kabar.');chat('Okee, Nadia siap-siap ♡','Pagi');await N(0,'Okee, Nadia siap-siap.');
 setScene('stall','Sabtu · 12.40');emotion=0;showNadia();await say('',0,'Kipas warung berputar pelan. Di kursi dekat jendela ada tas Nadia. Begitu lihat aku, dia angkat tasnya.');await N(0,'Sini, Kak. Kursinya dari tadi Nadia jagain.');await Z(2,'Pantes tasnya duluan yang diajak kencan.');await N(2,'Dia datang tepat waktu soalnya.');
 await N(hot===0?2:1,hot===0?'Yang satu level tiga ya, Bu. Saksi hidupnya ada di sini.':'Level satu dua-duanya, Bu. Hari ini kita makan dengan damai.');
 clink();await say('Suara warung',0,'Ting. Ting.');await N(0,order);await say('Ibu warung',0,seller);
 tone(812,.12);setTime('Sabtu · 12.41');chat(reply,'Sabtu · 12.41',true);await N(2,'Kakak ngapain ngechat? Orangnya ada di depan.');await Z(5,'Nad… HP kakak dari tadi di meja.');
 await ask('Zubair',5,'Nadia meletakkan HP-nya di sebelah HP-ku.',['Bandingkan HP']);compare(reply);await say('',0,'Kata-katanya sama persis. Aku melihat tanggal di kedua layar.');card.hidden=true;
 await N(7,'Mungkin semalam sinyalnya jelek. Baru kekirim sekarang.');await Z(6,'Itu juga yang kakak pikir. Tapi coba dengerin ini.');await recording();card.hidden=true;
 await N(6,'Kak, waktu kita teleponan semalam, Nadia lagi di kamar.');await say('',0,'Dua gelas datang. Nadia menggeser satu ke arahku, matanya masih tertuju ke HP.');await N(7,'Coba buka info pesannya. Nadia mau lihat jam rekaman itu masuk.');
 setScene('night','Sabtu · 23.16');chat('▱　Foto · Selembar kertas terlipat','23.16');await say('',0,'Malamnya aku sudah kembali di Balikpapan. Nadia mengirim foto selembar kertas yang dilipat dua.');
 const texts=[['Nadia',0,'Kak, Nadia baru nulis satu kata di kertas ini. Belum Nadia bilang ke siapa-siapa.'],['Zubair',2,'Kakak tebak. Seblak.'],['Nadia',3,'Ih, serius dulu sebentar 😭'],['Nadia',7,'Besok siang baru Nadia buka sama bacain. Kalau sekarang kakak dapat rekaman lagi, kita dengerin bareng, ya.']];
 for(const [speaker,i,t] of texts){chat(t,'23.16',speaker==='Zubair');await say(speaker,i,t)}
 setTime('Sabtu · 23.17');tone(812,.12);await recording(true);cleanStage();game.classList.add('covering');ctx.fillStyle='#16121d';ctx.fillRect(0,0,224,232);
 byId('chapterlabel').textContent='Bab 1 selesai';byId('subtitle').textContent='Dua Es Teh';byId('start').textContent='Main ulang　↻';byId('cover').hidden=false;running=false;
}
byId('start').onclick=chapter;draw('title');
</script>
