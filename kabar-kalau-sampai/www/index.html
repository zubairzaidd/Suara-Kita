<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132f38">
  <title>Kabar Kalau Sampai · Bab 1</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="cerita.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-ferry" viewBox="0 0 24 24"><path d="m3 14 9-3 9 3-3 5H6l-3-5ZM6 12V7h12v5M9 7V4h6v3M12 11v5M2 21c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 10v10h12V10"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="m3 10 4 0 5-5v14l-5-5H3zM15 9c2 2 2 4 0 6m3-9c4 4 4 8 0 12"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><path d="m3 10 4 0 5-5v14l-5-5H3zM16 9l6 6m0-6-6 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
  </svg>
  <main class="book">
    <section id="cover" class="cover" aria-labelledby="title">
      <div class="cover-art" aria-hidden="true">
        <div class="cover-date"><span></span> 30 OKT 2026</div>
        <div class="cover-cast"><div class="person zubair title-z"></div><div class="person nadia title-n"></div></div>
        <div class="route"><svg><use href="#i-ferry"/></svg><span>Balikpapan <b>→</b> Penajam</span></div>
      </div>
      <div class="cover-info">
        <div class="ticket-mark"><span class="mark"><svg><use href="#i-ferry"/></svg></span><span>Tiket penyeberangan</span><span class="ticket-rule"></span></div>
        <h1 id="title">Kabar Kalau<br><em>Sampai</em></h1>
        <p class="cover-premise">Sore aku mengantar Kak Zubair sampai pagar, ada dua orang lain yang ikut di kapal pulangnya.</p>
        <div class="ticket-bottom">
          <div class="chapter-line"><b>Bab 1</b><span>Kursi Sebelah Jendela</span></div>
          <button type="button" id="start" class="primary"><span id="startLabel">Mulai cerita</span><svg><use href="#i-arrow"/></svg></button>
          <button type="button" id="restart" class="text-button" hidden>Mulai dari awal</button>
        </div>
      </div>
    </section>

    <section id="play" class="play" aria-label="Kabar Kalau Sampai, Bab 1" hidden>
      <header class="bar">
        <button class="icon-button" type="button" id="home" aria-label="Kembali ke judul" title="Kembali ke judul"><svg><use href="#i-home"/></svg></button>
        <div class="brand">Kabar Kalau <i>Sampai</i></div>
        <button class="icon-button" type="button" id="sound" aria-pressed="false" aria-label="Nyalakan suara suasana" title="Suara suasana"><svg><use id="soundIcon" href="#i-off"/></svg></button>
      </header>
      <div id="stage" class="stage" data-bg="pelabuhan">
        <div class="place"><svg aria-hidden="true"><use href="#i-pin"/></svg><span id="location"></span><time id="clock"></time></div>
        <div id="channel" class="channel" hidden></div>
        <div id="cast" class="cast" aria-hidden="true"><div id="actorA" class="person"></div><div id="actorB" class="person" hidden></div></div>
      </div>
      <article id="card" class="card">
        <div class="card-line"><div class="avatar-frame"><div id="avatar" class="person"></div></div><div class="byline"><span id="voiceKind"></span><h2 id="speaker"></h2></div><span id="part" class="part"></span></div>
        <p id="words" class="words" aria-live="polite" aria-atomic="true"></p>
        <div id="choices" class="choices" aria-label="Pilihan Nadia" hidden></div>
        <div class="card-bottom"><div id="progress" class="progress" role="img" aria-label="Bagian 1 dari 5"><i></i><i></i><i></i><i></i><i></i></div><button id="next" type="button" class="next"><span id="nextLabel">Lanjut</span><svg><use href="#i-arrow"/></svg></button></div>
      </article>
    </section>

    <section id="end" class="ending" aria-labelledby="endTitle" hidden>
      <div class="ending-art" aria-hidden="true"></div>
      <div class="ending-paper">
        <div class="ticket-mark"><span class="mark"><svg><use href="#i-ferry"/></svg></span><span>Bab 1 selesai</span><span class="ticket-rule"></span></div>
        <h2 id="endTitle">Kabar <em>diterima.</em></h2>
        <p id="endText"></p>
        <div class="chapter-line"><b>18.12</b><span>Balikpapan → Penajam</span></div>
        <button type="button" id="again" class="primary"><span>Main lagi dari awal</span><svg><use href="#i-arrow"/></svg></button>
        <button type="button" id="endHome" class="text-button">Kembali ke judul</button>
      </div>
    </section>
  </main>
</body>
</html>
